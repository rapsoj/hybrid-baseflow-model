download:
  update: false                                   # false = skip files that already exist locally; true = top up with newer data
  gefs:
    start: "2020-10-01"                           # first init date in the GEFS 35-day archive
    end: null                                     # null = latest available
    workers: 16                                   # parallel threads for the GEFS download (1 = serial)
    refresh: false                                # true = re-download everything instead of appending new inits

data:
  target: total_flow                              # total_flow | baseflow | runoff: the flow component that is predicted (Boughton separation of the observed daily flow, see `baseflow` below)
  step_minutes: 15                                # resolution of the HDE data and the encoder input
  target_mode: delta_log_last                # absolute | delta_log_last (predict log-flow change from the recent observed flow, which becomes a decoder input) | anomaly (log-flow departure from the seasonal climatology median)
  anchor_hours: 24                                # delta_log_last: the anchor is the mean observed flow over this many hours before the origin
  seasonal_window_days: 15                        # seasonal climatology pools training flow within +/- this many days of the day of year
  output_step_minutes: 360                        # resolution of the predicted flow (mean of the 15-min flow over each bin); multiple of step_minutes, divides gefs.bin_hours
  history_days: 14                                # encoder window (HDE rainfall + groundwater)
  horizon_days: 28                                # predicted flow window (horizon_days * 1440 / output_step_minutes values)
  decoder_days: 28                                # forecast context given to the decoder (>= horizon_days)
  origin_time: "12:00"                            # UTC time of day each forecast is issued; one sample per day
  max_history_missing_fraction: 0.1               # drop samples whose encoder window has more missing values
  fill_limit_steps: 96                            # forward-fill limit (steps) for short groundwater gaps
  gefs:
    bin_hours: 6                                  # GEFS rainfall is aggregated to this resolution (= decoder token length)
    availability_lag_hours: 6                     # a 00Z init is only usable this long after init_time
    max_age_hours: 24                             # reject forecasts older than this at the origin time
  geosmart:
    availability_lag_hours: 0                     # extra lag after the last historic (ID 0) timestamp in each file
    max_age_hours: 24                             # reject forecasts older than this at the origin time
    min_member_fraction: 0.5                      # use the members present on the last forecast day if they are >= this fraction of the full ensemble (else only the members complete over the leading days with the full ensemble)
    min_members: 2                                # members needed to compute a standard deviation
  splits:
    train_fraction: 0.7
    val_fraction: 0.15                            # test gets the remainder; fractions apply to the time span left after two purge gaps
    min_samples_per_split: 5
  extreme:
    quantile: 0.95                                # events = flow above this quantile of historic flow (up to end of train)
    prediction_quantile: 0.5                      # predicted quantile compared to the threshold to flag an event
  baseflow:                                       # Boughton filter on observed daily flow: defines the baseflow/runoff targets and labels target steps by regime
    boughton_k: 0.95
    boughton_C: 0.5
    bfi_threshold: 0.9                              # day with baseflow/flow >= this = baseflow-dominated, otherwise runoff-dominated

model:
  d_model: 32                                     # small model: only ~1,000 training samples (~100 independent periods)
  n_heads: 4
  n_encoder_layers: 1
  n_decoder_layers: 1
  dim_feedforward: 64
  dropout: 0.3
  encoder_patch_steps: 24                         # encoder steps merged into one token (24 x 15 min = 6 h, the decoder token length): 14 days -> 56 tokens
  quantiles: [0.05, 0.1, 0.25, 0.5, 0.75, 0.9, 0.95]

training:
  seed: 42
  device: auto                                    # auto | cpu | cuda | mps
  epochs: 100
  batch_size: 16
  learning_rate: 0.001
  weight_decay: 0.01
  grad_clip: 1.0
  early_stopping_patience: 15

ensemble:                                         # GeoSmart members: the model sees one member trajectory at a time
  val_members_per_sample: 5                       # fixed random members per validation sample (early stopping loss)
  pool_draws_per_member: 64                       # probability levels drawn from each member's predictive distribution when pooling

ablation:
  restrict_to_common_samples: true                # every variant trains/tests on the same origins (fair comparison)
  # Optional GeoSmart options (only used when use_geosmart is true; defaults shown):
  #   geosmart_mode: level | anomaly        anomaly = member level minus its own level at the forecast origin (trajectory only)
  #   geosmart_ensemble: members | mean     mean = a single input, the ensemble mean, instead of one member at a time
  #   geosmart_skip: false                  true = linear skip from the GeoSmart channel at each output token to that token's outputs
  # `without_geosmart` is the baseline every other variant is compared with.
  variants:
    - name: with_geosmart
      use_gefs: true
      use_geosmart: true
    - name: without_geosmart
      use_gefs: true
      use_geosmart: false
    - name: geosmart_anomaly
      use_gefs: true
      use_geosmart: true
      geosmart_mode: anomaly
    - name: geosmart_skip
      use_gefs: true
      use_geosmart: true
      geosmart_skip: true
    - name: geosmart_mean
      use_gefs: true
      use_geosmart: true
      geosmart_ensemble: mean
    - name: geosmart_anomaly_mean_skip
      use_gefs: true
      use_geosmart: true
      geosmart_mode: anomaly
      geosmart_ensemble: mean
      geosmart_skip: true

final_run:                                        # `python main.py all-chalk-final`: multi-seed with vs without GeoSmart
  seeds: [42, 43, 44, 45, 46]
  baseline: without_geosmart
  geosmart: with_geosmart                         # the GeoSmart variant compared with the baseline
