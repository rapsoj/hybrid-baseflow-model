# Single source of truth for the pipeline: paths, constants, station ids and model specification.
# Any value can be overridden from the command line, e.g.
#   python main.py chilgrove --set data.history_days=7 --set training.epochs=5
# "{borehole}" in a path is replaced with the borehole key being modelled, "{geosmart_prefix}" with its lower-case GeoSmart prefix.

paths:
  hde_dir: data/hde/{borehole}                    # 15-min HDE csvs (written by processing/download_hde.py)
  geosmart_dir: data/geosmart/{geosmart_prefix}    # <dir>/<prefix>_forecasts.csv.gz (written by processing/download_geosmart.py)
  gefs_csv: data/gefs/{borehole}_gefs_forecasts.csv
  models_dir: models                              # models/<borehole>/<run_id>/<variant>/
  results_dir: results                            # results/<borehole>/<run_id>/ and results/<borehole>/summary.csv

